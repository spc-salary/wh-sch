<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <!-- ربط ملف الـ Manifest بمساره الصحيح داخل المجلد الفرعي -->
<link rel="manifest" href="/wh-sch/manifest.json">
<meta name="theme-color" content="c8dbe9">
    <title>مستودع جميل سرحان</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <base target="_top">
    
    <style>
        /* تنسيق حاوية التحميل */
        #loader-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff; /* لون خلفية الصفحة أثناء التحميل */
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        /* تصميم الدائرة المتحركة الاحترافي */
        .loader {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #3498db; /* لون الدائرة المتحرك */
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* زر ملء الشاشة: مساحة لمس مريحة مع مظهر بصري صغير */
        #fullscreenButton {
            position: fixed;
            right: max(16px, env(safe-area-inset-right));
            bottom: max(16px, env(safe-area-inset-bottom));
            z-index: 1000;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            padding: 0;
            color: #365a70;
            background: rgba(255, 255, 255, 0.78);
            border: 1px solid rgba(54, 90, 112, 0.18);
            border-radius: 14px;
            box-shadow: 0 6px 18px rgba(42, 74, 94, 0.14);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            cursor: pointer;
            touch-action: manipulation;
            transition: transform 0.18s ease, background-color 0.18s ease,
                box-shadow 0.18s ease, color 0.18s ease;
        }

        #fullscreenButton:hover {
            color: #1d4862;
            background: rgba(255, 255, 255, 0.94);
            box-shadow: 0 8px 22px rgba(42, 74, 94, 0.2);
            transform: translateY(-2px);
        }

        #fullscreenButton:active {
            transform: translateY(0) scale(0.94);
        }

        #fullscreenButton:focus-visible {
            outline: 3px solid rgba(52, 152, 219, 0.5);
            outline-offset: 3px;
        }

        #fullscreenButton svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-width: 1.8;
            animation: fullscreen-icon-pop 0.22s ease both;
        }

        @keyframes fullscreen-icon-pop {
            from { opacity: 0; transform: scale(0.78); }
            to { opacity: 1; transform: scale(1); }
        }

        #fullscreenButton[hidden] {
            display: none;
        }

        @media (prefers-reduced-motion: reduce) {
            #fullscreenButton {
                transition: none;
            }

            #fullscreenButton svg {
                animation: none;
            }
        }

        /* إخفاء السكرول بار أثناء التحميل */
        body { margin: 0; overflow: hidden; }
    </style>
</head>
<body>

    <div id="loader-container">
        <div class="loader"></div>
    </div>

    <iframe id="myIframe" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0;" 
        src="https://script.google.com/macros/s/AKfycbyWHdVgrnjhQVyWrD_skK-ysxmoEXTLicubB94gMfubtCZDx6wXt8FPreJelvwmGfyd0Q/exec">
    </iframe>

    <script>
        // وظيفة لإخفاء دائرة التحميل عند اكتمال تحميل الـ iframe
        var iframe = document.getElementById('myIframe');
        var loader = document.getElementById('loader-container');

        iframe.onload = function() {
            // إضافة تأثير اختفاء تدريجي بسيط
            loader.style.transition = "opacity 0.5s ease";
            loader.style.opacity = "0";
            setTimeout(function() {
                loader.style.display = "none";
            }, 500);
        };
    </script>
<!-- زر التحكم بملء الشاشة -->
<button
  id="fullscreenButton"
  type="button"
  aria-label="الدخول إلى ملء الشاشة"
  aria-pressed="false"
>
  <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
    <path d="M8 3H5a2 2 0 0 0-2 2v3"></path>
    <path d="M16 3h3a2 2 0 0 1 2 2v3"></path>
    <path d="M8 21H5a2 2 0 0 1-2-2v-3"></path>
    <path d="M16 21h3a2 2 0 0 0 2-2v-3"></path>
  </svg>
</button>

<script>
  (() => {
    const fullscreenButton = document.getElementById('fullscreenButton');
    const fullscreenElement = document.documentElement;
    const enterIcon = `
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M8 3H5a2 2 0 0 0-2 2v3"></path>
        <path d="M16 3h3a2 2 0 0 1 2 2v3"></path>
        <path d="M8 21H5a2 2 0 0 1-2-2v-3"></path>
        <path d="M16 21h3a2 2 0 0 0 2-2v-3"></path>
      </svg>`;
    const exitIcon = `
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M9 3v4a2 2 0 0 1-2 2H3"></path>
        <path d="M15 3v4a2 2 0 0 0 2 2h4"></path>
        <path d="M9 21v-4a2 2 0 0 0-2-2H3"></path>
        <path d="M15 21v-4a2 2 0 0 1 2-2h4"></path>
      </svg>`;

    const getFullscreenElement = () =>
      document.fullscreenElement || document.webkitFullscreenElement || null;

    const supportsFullscreen =
      typeof fullscreenElement.requestFullscreen === 'function' ||
      typeof fullscreenElement.webkitRequestFullscreen === 'function';

    if (!supportsFullscreen) {
      fullscreenButton.hidden = true;
      return;
    }

    const updateFullscreenButton = () => {
      const isFullscreen = Boolean(getFullscreenElement());
      fullscreenButton.innerHTML = isFullscreen ? exitIcon : enterIcon;
      fullscreenButton.setAttribute('aria-pressed', String(isFullscreen));
      fullscreenButton.setAttribute(
        'aria-label',
        isFullscreen ? 'الخروج من ملء الشاشة' : 'الدخول إلى ملء الشاشة'
      );
    };

    const enterFullscreen = () => {
      if (typeof fullscreenElement.requestFullscreen === 'function') {
        return fullscreenElement.requestFullscreen();
      }
      return fullscreenElement.webkitRequestFullscreen();
    };

    const exitFullscreen = () => {
      if (typeof document.exitFullscreen === 'function') {
        return document.exitFullscreen();
      }
      if (typeof document.webkitExitFullscreen === 'function') {
        return document.webkitExitFullscreen();
      }
      return Promise.resolve();
    };

    fullscreenButton.addEventListener('click', () => {
      const action = getFullscreenElement() ? exitFullscreen() : enterFullscreen();

      // الرفض أو عدم الدعم لا يعرض رسالة مزعجة للمستخدم.
      Promise.resolve(action).catch(() => {}).finally(updateFullscreenButton);
    });

    document.addEventListener('fullscreenchange', updateFullscreenButton);
    document.addEventListener('webkitfullscreenchange', updateFullscreenButton);
    updateFullscreenButton();
  })();
</script>
</body>
</html>
